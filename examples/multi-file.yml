name: Translate All Locale Files
on:
  push:
    branches: [main]
    paths:
      - 'locales/en/**'

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Translate locale files
        uses: Shipi18n/shipi18n-github-action@v3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          mode: 'translate'   # v3 defaults to check mode; opt into translation
          provider: 'openai'
          source-dir: 'locales/en'
          target-languages: 'es,fr,de,ja'
          create-pr: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
